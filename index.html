<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G+2 – 3D Interior (Rev-C)</title>
<style>
:root{--bg:#eef2f7;--fg:#0f172a;--card:#ffffffd9;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e2e8f0;--card:#111b2ed9;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e2e8f0;--card:#111b2ed9;--ac:#60a5fa}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block}
#ui{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-wrap:wrap;gap:6px;z-index:2}
button{border:1px solid var(--ac);background:var(--card);color:var(--fg);padding:7px 11px;border-radius:8px;font-weight:600;font-size:13px}
button.on{background:var(--ac);color:#fff}
#note{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--card);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.35;z-index:2}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="note"><b>Drag</b> to rotate, <b>pinch</b> to zoom. FF / SF hide the roof and floors above so you can look into the rooms. Preliminary layout (Rev-C): balcony in the middle, kitchen at the left end of the hall, bedroom bay at the right. Not for construction.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,0.5,400);
cam.position.set(-20,40,55);
const ctl=new THREE.OrbitControls(cam,cv);
ctl.target.set(11,12,8.5);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*0.495;
S.add(new THREE.AmbientLight(0xffffff,0.75));
const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(-15,50,40);S.add(dl);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

const T=0.4167,FL=[0,9.9167,19.8333],RF=29.75,WH=9.5,WC='#e7e5e4';
function B(g,x1,y1,x2,y2,z0,z1,col,op){
  if(x2-x1<0.001||y2-y1<0.001||z1-z0<0.001)return;
  const m=new THREE.MeshLambertMaterial({color:col,transparent:op!==undefined&&op<1,opacity:op===undefined?1:op});
  const b=new THREE.Mesh(new THREE.BoxGeometry(x2-x1,z1-z0,y2-y1),m);
  b.position.set((x1+x2)/2,(z0+z1)/2,(y1+y2)/2);g.add(b);
}
function W(g,hz,a1,a2,c,t,h0,h1,gaps){
  gaps=(gaps||[]).slice().sort((p,q)=>p[0]-q[0]);let a=a1;
  const seg=(s,e,z0,z1,col,op)=>{if(e-s<0.01||z1-z0<0.01)return;
    if(hz)B(g,s,c-t/2,e,c+t/2,z0,z1,col,op);else B(g,c-t/2,s,c+t/2,e,z0,z1,col,op)};
  for(const [s,e,sill,head] of gaps){
    seg(a,s,h0,h1,WC);seg(s,e,h0,h0+sill,WC);seg(s,e,h0+head,h1,WC);
    if(sill>0)seg(s,e,h0+sill,h0+head,'#7dd3fc',0.35);
    a=e}
  seg(a,a2,h0,h1,WC);
}
function stairs(g,base){
  const rise=9.9167/16,band=[[0.75,3.65],[3.9,6.8125]],dy=0.8333;
  for(let i=1;i<=8;i++)B(g,band[0][0],9.5625-dy*i,band[0][1],9.5625-dy*(i-1),base,base+i*rise,'#a8a29e');
  B(g,0.75,0.75,6.8125,3.73,base,base+8*rise,'#a8a29e');
  for(let j=1;j<=7;j++)B(g,band[1][0],3.73+dy*(j-1),band[1][1],3.73+dy*j,base,base+(8+j)*rise,'#a8a29e');
}
function cols(g,b0,b1){
  const C=[[0,0,.75,1],[6.625,0,.75,1],[14.125,0,.75,1],[21.25,0,.75,1]];
  const F=[[0,12.75,.75,1.25],[6.625,12.75,.75,1.25],[14.125,12.75,.75,1.25],[21.25,12.75,.75,1.25]];
  C.concat(F).forEach(([x,y,w,d])=>B(g,x,y,x+w,y+d,b0,b1,'#b91c1c'));
}
const G=[new THREE.Group(),new THREE.Group(),new THREE.Group()],roof=new THREE.Group();
S.add(G[0],G[1],G[2],roof);

// ---- ground floor
(function(){const g=G[0];
  B(g,0,0,22,14,-T,0,'#94a3b8');B(g,0.75,9.75,7,14,0,0.03,'#fffbeb');B(g,7.2,0.8,21.2,13.3,0,0.03,'#f1f5f9');
  W(g,true,0,22,0.375,0.75,0,WH,[]);
  W(g,false,0,14,0.375,0.75,0,WH,[]);W(g,false,0,14,21.625,0.75,0,WH,[]);
  W(g,false,0.75,14,7,0.375,0,WH,[]);
  W(g,true,0,7,13.625,0.75,0,WH,[[1.5,5,0,7]]);
  B(g,7.5,13.85,14,14,0,8,'#60a5fa',0.55);B(g,15,13.85,21,14,0,8,'#60a5fa',0.55);
  B(g,7.4,13.3,21.2,14,8,FL[1]-T,'#d6d3d1');
  stairs(g,0);cols(g,0,FL[1]-T);
})();

// ---- upper floors (FF, SF)
function upper(i){
  const g=G[i],b=FL[i],h1=b+WH;
  B(g,0,0,22,17,b-T,b,'#94a3b8');
  B(g,10.5,14,18.5,17,b,b+0.03,'#bfdbfe');                 // open balcony floor
  B(g,0.75,9.75,7,12.75,b,b+0.03,'#fffbeb');               // landing
  B(g,0.75,12.75,7,16.25,b,b+0.03,'#e0f2fe');             // bath
  B(g,7.2,0.8,14.3,16.25,b,b+0.03,'#f8fafc');              // hall
  B(g,14.7,0.8,21.2,13.3,b,b+0.03,'#d1fae5');              // bedroom
  W(g,true,0,22,0.375,0.75,b,h1,[]);
  W(g,false,0,17,0.375,0.75,b,h1,[]);W(g,false,0,17,21.625,0.75,b,h1,[]);
  W(g,false,0.75,17,7,0.375,b,h1,[[10,12.75,0,7],[14.2,16.2,0,7]]);
  W(g,true,0,7,12.75,0.375,b,h1,[]);
  W(g,false,0.75,14,14.5,0.375,b,h1,[[9.5,12.5,0,7]]);
  W(g,true,0,10.5,16.625,0.75,b,h1,[[2.5,5.5,5,7],[7.8,10.2,3.5,7]]);
  W(g,false,14,16.25,10.5,0.375,b,h1,[]);
  W(g,true,10.5,14.5,13.625,0.75,b,h1,[[11,13.5,0,7]]);
  W(g,true,14.5,18.5,13.625,0.75,b,h1,[[15,17.5,0,7]]);
  W(g,false,14,16.25,18.5,0.375,b,h1,[]);
  W(g,true,18.5,22,16.625,0.75,b,h1,[[19,21.5,3,7]]);
  B(g,10.5,16.85,18.5,17,b,b+3,'#38bdf8',0.45);            // balcony railing
  // furniture
  B(g,15.6,0.95,20.6,7.45,b,b+1.6,'#fde68a');B(g,15.8,1,20.4,2,b+1.6,b+1.9,'#fff');
  B(g,20.3,8,21.2,12.5,b,b+6.5,'#a16207');
  B(g,15.7,11.8,18,13.2,b,b+2.3,'#92400e');                // dresser
  B(g,8,3,11,4.6,b,b+1.5,'#6366f1');B(g,8,2.4,11,3,b,b+2.6,'#4f46e5');
  B(g,9,6.2,11.2,8.2,b,b+1.3,'#92400e');B(g,12.9,1,14.1,2.2,b,b+6,'#e5e7eb');
  B(g,7.2,15,10.4,16.2,b,b+2.75,'#fcd34d');B(g,7.2,12.9,9.2,15,b,b+2.75,'#fcd34d');
  B(g,7.4,15.2,8.6,16,b+2.75,b+2.85,'#94a3b8');B(g,9,15.2,10.2,16,b+2.75,b+2.85,'#111827');
  B(g,5,13.4,6.2,15.1,b,b+1.3,'#fff');B(g,3.3,13.2,4.4,14,b,b+2.8,'#fff');
  B(g,0.95,13.2,2.95,15.2,b,b+0.08,'#7dd3fc');B(g,4.7,15.3,6,16.2,b,b+3,'#e5e7eb');
  stairs(g,b);cols(g,b-T,h1);
}
upper(1);upper(2);
G[0].children.length;

// ---- roof, parapet, mumty
(function(){const g=roof;
  B(g,0,0,22,17,RF-T,RF,'#94a3b8');
  W(g,true,0,22,0.19,0.375,RF,RF+3,[]);W(g,true,0,22,16.81,0.375,RF,RF+3,[]);
  W(g,false,0,17,0.19,0.375,RF,RF+3,[]);W(g,false,0,17,21.81,0.375,RF,RF+3,[]);
  W(g,true,0,7,0.375,0.75,RF,RF+7.9,[]);W(g,false,0,9.75,0.375,0.75,RF,RF+7.9,[]);
  W(g,false,0,9.75,7,0.375,RF,RF+7.9,[]);W(g,true,0,7,9.75,0.375,RF,RF+7.9,[[4,6.5,0,6.5]]);
  B(g,0,0,7,9.75,RF+7.9,RF+8.3,'#78716c');
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,2.2,20),new THREE.MeshLambertMaterial({color:'#1d4ed8'}));
  m.position.set(1.9,RF+8.3+1.1,1.9);g.add(m);
  const m2=m.clone();m2.position.set(5.1,RF+8.3+1.1,1.9);g.add(m2);
})();

// ground plane
const gp=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshLambertMaterial({color:'#cbd5e1'}));
gp.rotation.x=-Math.PI/2;gp.position.set(11,-0.5,8);S.add(gp);

// ---- UI
const modes={'All':[1,1,1,1],'GF':[1,0,0,0],'FF':[1,1,0,0],'SF':[1,1,1,0]};
const ui=document.getElementById('ui');
function set(k){const m=modes[k];G.forEach((g,i)=>g.visible=!!m[i]);roof.visible=!!m[3];
  [...ui.children].forEach(b=>b.classList.toggle('on',b.textContent===k));
  ctl.target.set(11,k==='All'?15:k==='GF'?3:k==='FF'?13:23,8.5)}
Object.keys(modes).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>set(k);ui.appendChild(b)});
set('All');
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(S,cam)})();
</script></body></html>
